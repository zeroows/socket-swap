name: Production Build and Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tags:
        description: "Manual Workflow"
        required: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  BINARY_NAME: socket-swap

jobs:
  build-binaries:
    name: Build Binaries (glibc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
          
      # Set up Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Zig for C/C++ cross-compilation
      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: pip3 install cargo-zigbuild
        
      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.rust_target }}-glibc-cargo-${{ hashFiles('**/Cargo.lock') }}
          cache-targets: true

      - name: Build (glibc)
        env:
          BUILD_VERSION: "${{ github.ref_name }}"
          RUSTFLAGS: "-C link-arg=-Wl,--as-needed"
        run: |
          cargo zigbuild --release --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/${{ env.BINARY_NAME }} ./${{ env.BINARY_NAME }}-${{ matrix.arch }}
          
          # sanity check the binary
          file ./${{ env.BINARY_NAME }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.arch }}

  build-and-push:
    name: Build and Push Multi-Platform Image
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            maintainer=${{github.repository_owner}}
            org.opencontainers.image.title=${{github.repository}}
            org.opencontainers.image.description=SocketSwap Production Build from ${{github.ref_name}}
            org.opencontainers.image.vendor=${{github.repository_owner}}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Platform Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

