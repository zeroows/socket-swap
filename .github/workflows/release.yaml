name: Production Build and Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tags:
        description: "Manual Workflow"
        required: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  BINARY_NAME: socket-swap

jobs:
  build-binaries:
    name: Build Binaries (glibc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Updated Cargo.toml version to $VERSION"
          
      # Set up Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Zig for C/C++ cross-compilation
      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: pip3 install cargo-zigbuild
        
      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.rust_target }}-glibc-cargo-${{ hashFiles('**/Cargo.lock') }}
          cache-targets: true

      - name: Build (glibc)
        env:
          BUILD_VERSION: "${{ github.ref_name }}"
          RUSTFLAGS: "-C link-arg=-Wl,--as-needed"
        run: |
          cargo zigbuild --release --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/${{ env.BINARY_NAME }} ./${{ env.BINARY_NAME }}-${{ matrix.arch }}
          
          # sanity check the binary
          file ./${{ env.BINARY_NAME }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.arch }}

  build-and-push:
    name: Build and Push Multi-Platform Image
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            maintainer=${{github.repository_owner}}
            org.opencontainers.image.title=${{github.repository}}
            org.opencontainers.image.description=SocketSwap Production Build from ${{github.ref_name}}
            org.opencontainers.image.vendor=${{github.repository_owner}}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Platform Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Write to GitHub Summary
      - name: Write GitHub Summary
        if: always()
        run: |
          echo "# 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determine status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          
          echo "**Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Service Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "| ${{ env.BINARY_NAME }} | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ${{ env.BINARY_NAME }} | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Deployment Guide" >> $GITHUB_STEP_SUMMARY
          echo "To deploy version **${{ github.ref_name }}**, apply the Kubernetes manifests:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 1. Apply RBAC" >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f k8s/rbac.yaml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 2. Deploy the shim" >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f k8s/deployment.yaml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 3. Expose via Service" >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f k8s/service.yaml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📖 Quick Start (Python)" >> $GITHUB_STEP_SUMMARY
          echo "Access the Docker API from anywhere in your cluster:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`python" >> $GITHUB_STEP_SUMMARY
          echo "import docker" >> $GITHUB_STEP_SUMMARY
          echo "client = docker.DockerClient(base_url='http://socket-swap.default.svc:2375')" >> $GITHUB_STEP_SUMMARY
          echo "container = client.containers.run('busybox', 'echo Hello!', detach=True)" >> $GITHUB_STEP_SUMMARY
          echo "print(container.logs().decode())" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

